name: Build CaptionBrain Full APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract CaptionBrain Full project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q CaptionBrainFull_v1.0_BuildReady.zip -d buildsrc
          echo "Project extracted successfully"
          ls -la buildsrc

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build CaptionBrain Full APK
        working-directory: buildsrc
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh buildsrc/app/build/outputs/apk/debug/
          test -f buildsrc/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CaptionBrain Full APK
        uses: actions/upload-artifact@v4
        with:
          name: CaptionBrain-Full-v1.0-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
